# formalization.yaml v0.4
version: "v0.4"

project:
  name: "Exact permanent algorithms for boson sampling: Ryser, BB/FG (Glynn), Gray-code and multiplicity variants"
  description: >-
    Correctness over an arbitrary commutative ring of the exact permanent
    algorithms used in the data-flow-engine boson sampling simulator of Morse et
    al. (New J. Phys. 26, 033033, 2024). The results cover the textbook
    permutation sums for the permanent and the determinant, Ryser's
    inclusion-exclusion formula, and the Balasubramanian-Bax-Franklin-Glynn
    (BB/FG) formula with the first sign fixed. Both are also proved when
    evaluated in binary reflected Gray-code order with incremental row or
    column sums: the traditional Nijenhuis-Wilf form for Ryser and the
    single-sign-flip form for BB/FG. Further results cover the generalisations
    to matrices with repeated rows and columns, which are sums over occupation
    vectors weighted by products of binomial coefficients, and their
    evaluation in reflected mixed-radix (n-ary) Gray-code order with
    incrementally updated sums and an exact integer-division update of the
    binomial weight, as in the generalised Clifford & Clifford sampler.
  authors:
    - "Gregory Morse"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Gregory Morse"

